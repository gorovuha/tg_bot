[project]
name = "propaganda-watchdog-bot"
version = "0.2.0"
description = "Telegram bot that spots propaganda narratives and shows receipts (DIAL 2026, Problem 03)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "python-telegram-bot>=21.6,<23",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
data = [
    "curl_cffi>=0.7",
]
ml = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "scikit-learn>=1.9.1",
    "datasets>=5.0.1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["BLE001", "DTZ007"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
